name: native builds

# Native toolchains stay behind workflow_dispatch. macOS runners, emulators and
# release packaging never run on a push.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which client to build
        required: true
        type: choice
        options: [ios, android]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # Fails on purpose. There is no ios/ or android/ directory in this repo,
      # and a job that prints a sentence about wiring that does not exist and
      # then goes green is worse than no job: it answers "is the native build
      # working" with yes.
      - name: build
        run: |
          echo "No native client in this repo yet: ${{ inputs.platform }}/ does not exist."
          echo "docs/mobile-spec.md is the contract a client would be built against."
          exit 1
