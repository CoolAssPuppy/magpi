name: light gate

# Push on the default branch, and pull_request everywhere else. Listening for
# both on every branch ran the gate twice for each push to a PR branch, and the
# concurrency group below cannot dedupe them because the two events carry
# different refs.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: light-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # No version here: the action reads packageManager from package.json, and
      # naming a second one failed every run with "Multiple versions of pnpm".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - uses: dopplerhq/cli-action@v3

      - name: light gate
        run: doppler run -- node scripts/gate.mjs --light --strict
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_DEV }}
