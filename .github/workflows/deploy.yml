name: deploy supabase

# Migrations and edge functions go to the hosted project on every push to main
# that touches them. SB_AUTH_HOOK_SECRET is here only because config.toml reads
# it with env() and the CLI refuses to parse a config whose hook secret is empty.
# Function secrets are pushed by hand from Doppler, see README.
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/functions/**
      - supabase/config.toml
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SB_AUTH_HOOK_SECRET: ${{ secrets.SB_AUTH_HOOK_SECRET }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - run: supabase link --project-ref "$PROJECT_ID"

      - run: supabase db push

      - run: supabase functions deploy --project-ref "$PROJECT_ID"
